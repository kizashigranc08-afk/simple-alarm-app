<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当番アプリ</title>
<style>
:root {
  --blue:   #1d4ed8;
  --blue2:  #2563eb;
  --blue3:  #3b82f6;
  --light:  #eff6ff;
  --pale:   #dbeafe;
  --white:  #ffffff;
  --text:   #1e293b;
  --sub:    #64748b;
  --orange: #ea580c;
  --red:    #dc2626;
  --border: #bfdbfe;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
  background: linear-gradient(160deg, #1e3a8a, #2563eb 55%, #60a5fa);
  min-height: 100vh;
  padding-bottom: 48px;
  color: var(--text);
}

/* ヘッダー */
header {
  text-align: center;
  padding: 22px 16px 14px;
  color: #fff;
}
#app-title {
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: .04em;
}
#app-title span { opacity: .7; font-size: .85rem; font-weight: 400; }
.header-edit {
  margin-top: 6px;
  background: rgba(255,255,255,.2);
  border: 1px solid rgba(255,255,255,.4);
  color: #fff;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: .78rem;
  cursor: pointer;
}

/* タスクタブ */
.tabs-wrap {
  padding: 0 12px 14px;
  overflow-x: auto;
}
.tabs {
  display: flex;
  gap: 8px;
  min-width: max-content;
  max-width: 560px;
  margin: 0 auto;
}
.tab {
  flex: 1;
  min-width: 88px;
  background: rgba(255,255,255,.15);
  border: 1.5px solid rgba(255,255,255,.3);
  color: #fff;
  border-radius: 10px;
  padding: 9px 6px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
.tab.on {
  background: #fff;
  color: var(--blue);
  border-color: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,.15);
}
.tab-icon { display: block; font-size: 1.35rem; margin-bottom: 3px; }

/* コンテナ */
.wrap {
  max-width: 540px;
  margin: 0 auto;
  padding: 0 12px;
}

/* カード */
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 4px 20px rgba(30,58,138,.12);
  margin-bottom: 14px;
}
.card-title {
  font-size: .76rem;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* モード */
.mode-row { display: flex; gap: 8px; margin-bottom: 14px; }
.mode-btn {
  flex: 1;
  padding: 9px;
  border: 2px solid var(--blue3);
  border-radius: 8px;
  background: transparent;
  color: var(--blue3);
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
}
.mode-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; }

/* 当番カード */
#duty-card {
  background: linear-gradient(135deg, var(--light), var(--pale));
  border: 2px solid var(--border);
  text-align: center;
}
.duty-badge {
  display: inline-block;
  background: var(--blue);
  color: #fff;
  font-size: .72rem;
  font-weight: 700;
  padding: 3px 13px;
  border-radius: 20px;
  margin-bottom: 10px;
  letter-spacing: .04em;
}
.duty-label { font-size: .85rem; color: var(--sub); margin-bottom: 6px; }
#current-name {
  font-size: 3.6rem;
  font-weight: 900;
  color: #1e3a8a;
  line-height: 1.1;
  margin: 10px 0 14px;
  word-break: break-all;
}
.no-member { font-size: 1rem; color: var(--sub); padding: 14px 0; }
#duty-sub { font-size: .82rem; color: var(--sub); margin-bottom: 10px; }

/* ボタン */
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .03em;
  margin-top: 10px;
}
.btn:first-of-type { margin-top: 0; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-blue   { background: linear-gradient(135deg,#1d4ed8,#2563eb); color:#fff; box-shadow:0 4px 14px rgba(29,78,216,.3); }
.btn-orange { background: linear-gradient(135deg,#ea580c,#f97316); color:#fff; box-shadow:0 4px 14px rgba(234,88,12,.25); }
.btn-gray   { background: linear-gradient(135deg,#475569,#64748b); color:#fff; margin-top:14px !important; }
.btn-red    { background: linear-gradient(135deg,#dc2626,#ef4444); color:#fff; }
.btn-outline {
  background: transparent;
  border: 2px solid var(--blue);
  color: var(--blue);
  padding: 10px;
  font-size: .9rem;
  box-shadow: none;
}

/* メンバー入力行 */
.add-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: stretch;
}
.add-row input {
  flex: 1;
  padding: 12px 14px;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  background: #f8fafc;
  color: var(--text);
  -webkit-appearance: none;
}
.add-row input:focus {
  border-color: var(--blue3);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
.add-btn {
  flex-shrink: 0;
  padding: 0 20px;
  background: linear-gradient(135deg,#1d4ed8,#3b82f6);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: .95rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.add-btn:active { opacity: .85; }

/* メンバーリスト */
.member-list { list-style: none; }
.member-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 13px;
  border-radius: 9px;
  margin-bottom: 6px;
  background: var(--light);
  border: 1.5px solid transparent;
}
.member-item.current { background: #dbeafe; border-color: var(--blue3); }
.member-info { display: flex; flex-direction: column; gap: 2px; }
.member-name { font-size: .95rem; font-weight: 600; }
.member-now {
  display: inline-block;
  background: var(--blue);
  color: #fff;
  font-size: .65rem;
  padding: 1px 7px;
  border-radius: 10px;
  margin-left: 6px;
  vertical-align: middle;
}
.member-stats { font-size: .72rem; color: var(--sub); }
.del-btn {
  flex-shrink: 0;
  padding: 5px 11px;
  background: #fee2e2;
  color: var(--red);
  border: 1.5px solid #fca5a5;
  border-radius: 6px;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
}

/* タスク名編集 */
.task-edit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.task-edit-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--light);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
}
.task-edit-item.active { border-color: var(--blue3); background: var(--pale); }
.te-icon {
  width: 34px;
  text-align: center;
  padding: 4px;
  border: 1.5px solid #e2e8f0;
  border-radius: 6px;
  font-size: 1rem;
  background: #fff;
  outline: none;
}
.te-name {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  border: 1.5px solid #e2e8f0;
  border-radius: 6px;
  font-size: .82rem;
  font-family: inherit;
  background: #fff;
  outline: none;
  color: var(--text);
}
.te-icon:focus, .te-name:focus { border-color: var(--blue3); }
.save-btn {
  padding: 8px 14px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
}

/* 統計 */
.stats-list { list-style: none; }
.stats-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 13px;
  border-radius: 9px;
  margin-bottom: 6px;
  background: var(--light);
  font-size: .88rem;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 700;
  color: #fff;
  margin-left: 5px;
}
.badge-blue { background: var(--blue); }
.badge-or   { background: var(--orange); }

/* 履歴 */
.hist-list {
  list-style: none;
  max-height: 280px;
  overflow-y: auto;
}
.hist-item {
  padding: 9px 12px;
  border-radius: 9px;
  margin-bottom: 5px;
  background: var(--light);
  font-size: .82rem;
  border-left: 3px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.hist-item.done { border-left-color: var(--blue); }
.hist-item.skip { border-left-color: var(--orange); }
.hist-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.hist-name { font-weight: 700; }
.hist-task { font-size: .7rem; color: var(--sub); }
.h-tag {
  padding: 2px 9px;
  border-radius: 10px;
  font-size: .7rem;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  flex-shrink: 0;
}
.h-done { background: var(--blue); }
.h-skip { background: var(--orange); }
.hist-time { font-size: .72rem; color: var(--sub); }
.hist-reason { font-size: .75rem; color: var(--orange); font-style: italic; }
.no-data { font-size: .82rem; color: var(--sub); text-align: center; padding: 12px 0; }

/* モーダル */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.6);
  z-index: 500;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.modal h2 { font-size: 1.05rem; color: #1e3a8a; margin-bottom: 12px; }
.modal-input {
  display: block;
  width: 100%;
  padding: 11px 13px;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  background: #f8fafc;
  color: var(--text);
  margin-bottom: 8px;
  -webkit-appearance: none;
}
.modal-input:focus { border-color: var(--blue3); background: #fff; }
.modal-textarea {
  display: block;
  width: 100%;
  padding: 11px 13px;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  background: #f8fafc;
  color: var(--text);
  min-height: 80px;
  resize: vertical;
  -webkit-appearance: none;
}
.modal-textarea:focus { border-color: var(--blue3); background: #fff; }
.modal-row { display: flex; gap: 10px; margin-top: 14px; }
.modal-row .btn { flex: 1; margin-top: 0; }

@media (min-width: 540px) {
  #current-name { font-size: 4.4rem; }
}
</style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <div id="app-title">当番アプリ <span id="app-sub-text">ゴミ捨て・掃除・その他の当番管理</span></div>
  <button class="header-edit" onclick="openTitleModal()">✏️ アプリ名を変更</button>
</header>

<!-- タスクタブ -->
<div class="tabs-wrap">
  <div class="tabs" id="tabs"><!-- JS描画 --></div>
</div>

<div class="wrap">

  <!-- モード -->
  <div class="mode-row">
    <button class="mode-btn" id="m-order" onclick="setMode('order')">📋 順番制</button>
    <button class="mode-btn" id="m-fair"  onclick="setMode('fair')">⚖️ 公平抽選</button>
  </div>

  <!-- 当番カード -->
  <div class="card" id="duty-card">
    <div class="duty-badge" id="duty-badge">-</div>
    <div class="duty-label">次の当番</div>
    <div id="current-name" class="no-member">メンバーを追加してください</div>
    <div id="duty-sub"></div>
    <button class="btn btn-blue"   id="btn-done" onclick="markDone()"      disabled>✅ 完了した</button>
    <button class="btn btn-orange" id="btn-skip" onclick="openSkipModal()" disabled>⏩ 今日は無理・スキップ</button>
    <button class="btn btn-gray"   id="btn-undo" onclick="undo()"          disabled>↩️ 1つ前に戻す</button>
  </div>

  <!-- メンバー追加 -->
  <div class="card">
    <div class="card-title">👥 メンバー</div>
    <div class="add-row">
      <input type="text" id="name-input" placeholder="名前を入力してEnter"
             maxlength="20" autocomplete="off"
             onkeyup="if(event.key==='Enter'){addMember();event.preventDefault();}">
      <button class="add-btn" onclick="addMember()">追加</button>
    </div>
    <ul class="member-list" id="member-list">
      <li class="no-data">メンバーがいません</li>
    </ul>
  </div>

  <!-- タスク名編集 -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div class="card-title" style="margin-bottom:0;">⚙️ タスク名編集</div>
      <button class="save-btn" onclick="saveTaskNames()">💾 保存</button>
    </div>
    <p style="font-size:.78rem;color:var(--sub);margin-bottom:10px;">絵文字と名前を変更すればどんな当番にも使えます</p>
    <div class="task-edit-grid" id="task-edit-grid"><!-- JS描画 --></div>
  </div>

  <!-- 統計 -->
  <div class="card">
    <div class="card-title">📊 統計</div>
    <ul class="stats-list" id="stats-list">
      <li class="no-data">データなし</li>
    </ul>
  </div>

  <!-- 履歴 -->
  <div class="card">
    <div class="card-title">📜 履歴</div>
    <ul class="hist-list" id="hist-list"></ul>
    <p class="no-data" id="no-hist">まだ記録がありません</p>
  </div>

  <!-- リセット -->
  <div class="card">
    <div class="card-title">⚠️ リセット</div>
    <p style="font-size:.82rem;color:var(--sub);margin-bottom:12px;">
      現在のタスクの回数・履歴・順番を初期化します（メンバーは保持）
    </p>
    <button class="btn btn-red" onclick="doReset()">🔄 リセットする</button>
  </div>

</div>

<!-- スキップモーダル -->
<div class="overlay" id="skip-overlay">
  <div class="modal">
    <h2>⏩ スキップの理由（任意）</h2>
    <textarea class="modal-textarea" id="skip-reason" placeholder="例：出張中、体調不良　など"></textarea>
    <div class="modal-row">
      <button class="btn btn-outline" onclick="closeSkipModal()">キャンセル</button>
      <button class="btn btn-orange"  onclick="markSkip()">スキップする</button>
    </div>
  </div>
</div>

<!-- アプリ名モーダル -->
<div class="overlay" id="title-overlay">
  <div class="modal">
    <h2>✏️ アプリ名を変更</h2>
    <input class="modal-input" id="title-input"    placeholder="アプリ名（例：掃除当番）" maxlength="30">
    <input class="modal-input" id="subtitle-input" placeholder="サブタイトル（任意）"     maxlength="40">
    <div class="modal-row">
      <button class="btn btn-outline" onclick="closeTitleModal()">キャンセル</button>
      <button class="btn btn-blue"    onclick="saveTitle()">保存</button>
    </div>
  </div>
</div>

<script>
/* ===================================================
   データ構造
   state.members[i] = { id, name, done:{t1:0,...}, skip:{t1:0,...} }
   state.idx        = { t1: 0, t2: 0, ... }  // 各タスクの現在インデックス
   =================================================== */

const KEY = 'dutyapp_v3';

function fresh() {
  return {
    title:    '当番アプリ',
    subtitle: 'ゴミ捨て・掃除・その他の当番管理',
    mode:     'order',
    tasks: [
      { id:'t1', icon:'🗑️', name:'燃えるゴミ' },
      { id:'t2', icon:'♻️',  name:'プラスチック' },
      { id:'t3', icon:'📦', name:'ダンボール' },
      { id:'t4', icon:'🧴', name:'ペットボトル' },
    ],
    cur:     't1',      // 現在選択中のタスクID
    members: [],
    idx:     {},        // { taskId: number }
    history: [],
    undos:   [],        // スナップショット最大5件
  };
}

let S = fresh();

/* ---------- 保存・読込 ---------- */
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    // 各フィールドを安全にマージ
    if (d.title)    S.title    = d.title;
    if (d.subtitle !== undefined) S.subtitle = d.subtitle;
    if (d.mode)     S.mode     = d.mode;
    if (Array.isArray(d.tasks) && d.tasks.length === 4) S.tasks = d.tasks;
    if (d.cur)      S.cur      = d.cur;
    if (Array.isArray(d.members)) {
      // メンバーを安全にマイグレーション
      S.members = d.members.map(m => ({
        id:   m.id   || uid(),
        name: m.name || '?',
        done: (m.done && typeof m.done === 'object') ? m.done : {},
        skip: (m.skip && typeof m.skip === 'object') ? m.skip : {},
      }));
    }
    if (d.idx && typeof d.idx === 'object') S.idx = d.idx;
    if (Array.isArray(d.history)) S.history = d.history;
    if (Array.isArray(d.undos))   S.undos   = d.undos;
  } catch(e) { S = fresh(); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

/* ---------- Undo ---------- */
function pushUndo() {
  S.undos.push(JSON.parse(JSON.stringify({
    mode: S.mode, members: S.members, idx: S.idx, history: S.history,
  })));
  if (S.undos.length > 5) S.undos.shift();
}
function undo() {
  if (!S.undos.length) return;
  const snap = S.undos.pop();
  S.mode    = snap.mode;
  S.members = snap.members;
  S.idx     = snap.idx;
  S.history = snap.history;
  save(); draw();
}

/* ---------- モード ---------- */
function setMode(m) {
  S.mode = m;
  save(); draw();
}

/* ---------- タスク切替 ---------- */
function selectTask(id) {
  S.cur = id;
  save(); draw();
}

/* ---------- 現在の当番 ---------- */
function curMember() {
  if (!S.members.length) return null;
  const tid = S.cur;
  const i   = (S.idx[tid] || 0) % S.members.length;

  if (S.mode === 'order') return { m: S.members[i], i };

  // 公平抽選：完了回数が最少の人
  const min = Math.min(...S.members.map(m => m.done[tid] || 0));
  const cands = S.members
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => (m.done[tid] || 0) === min);

  // 現在インデックスが候補にいればそのまま
  const current = S.members[i];
  if (cands.find(c => c.m.id === current.id)) return { m: current, i };
  return cands[0];
}

/* ---------- 次インデックス ---------- */
function nextIdx(curI) {
  if (!S.members.length) return 0;
  const tid = S.cur;
  if (S.mode === 'order') return (curI + 1) % S.members.length;

  // 公平抽選：今の人以外で完了回数最少
  const others = S.members.map((m, i) => ({ m, i })).filter(({ i }) => i !== curI);
  if (!others.length) return curI;
  const min = Math.min(...others.map(({ m }) => m.done[tid] || 0));
  const cands = others.filter(({ m }) => (m.done[tid] || 0) === min);
  return cands[Math.floor(Math.random() * cands.length)].i;
}

/* ---------- メンバー追加 ---------- */
function addMember() {
  const el   = document.getElementById('name-input');
  const name = el.value.trim();
  if (!name) { el.focus(); return; }
  if (S.members.find(m => m.name === name)) {
    alert('同じ名前のメンバーがいます');
    el.select();
    return;
  }
  const done = {}, skip = {};
  S.tasks.forEach(t => { done[t.id] = 0; skip[t.id] = 0; });
  S.members.push({ id: uid(), name, done, skip });
  el.value = '';
  el.focus();
  save(); draw();
}

/* ---------- メンバー削除 ---------- */
function delMember(id) {
  const m = S.members.find(m => m.id === id);
  if (!m || !confirm(`「${m.name}」を削除しますか？`)) return;
  S.members = S.members.filter(m => m.id !== id);
  if (S.members.length) {
    Object.keys(S.idx).forEach(tid => {
      S.idx[tid] = (S.idx[tid] || 0) % S.members.length;
    });
  } else { S.idx = {}; }
  save(); draw();
}

/* ---------- 完了 ---------- */
function markDone() {
  const c = curMember();
  if (!c) return;
  const tid = S.cur;
  pushUndo();
  c.m.done[tid] = (c.m.done[tid] || 0) + 1;
  S.history.unshift({ id: uid(), tid, name: c.m.name, type: 'done', reason: '', time: new Date().toISOString() });
  S.idx[tid] = nextIdx(c.i);
  save(); draw();
}

/* ---------- スキップ ---------- */
function openSkipModal() {
  document.getElementById('skip-reason').value = '';
  document.getElementById('skip-overlay').classList.add('open');
}
function closeSkipModal() {
  document.getElementById('skip-overlay').classList.remove('open');
}
function markSkip() {
  const reason = document.getElementById('skip-reason').value.trim();
  closeSkipModal();
  const c = curMember();
  if (!c) return;
  const tid = S.cur;
  pushUndo();
  c.m.skip[tid] = (c.m.skip[tid] || 0) + 1;
  S.history.unshift({ id: uid(), tid, name: c.m.name, type: 'skip', reason, time: new Date().toISOString() });
  S.idx[tid] = ((S.idx[tid] || 0) + 1) % S.members.length;
  save(); draw();
}

/* ---------- タスク名保存 ---------- */
function saveTaskNames() {
  S.tasks.forEach((t, i) => {
    const icon = document.getElementById('te-icon-' + i);
    const name = document.getElementById('te-name-' + i);
    if (icon && icon.value.trim()) t.icon = icon.value.trim();
    if (name && name.value.trim()) t.name = name.value.trim();
  });
  save(); draw();
}

/* ---------- アプリ名モーダル ---------- */
function openTitleModal() {
  document.getElementById('title-input').value    = S.title;
  document.getElementById('subtitle-input').value = S.subtitle;
  document.getElementById('title-overlay').classList.add('open');
}
function closeTitleModal() {
  document.getElementById('title-overlay').classList.remove('open');
}
function saveTitle() {
  const t = document.getElementById('title-input').value.trim();
  const s = document.getElementById('subtitle-input').value.trim();
  if (t) S.title    = t;
  S.subtitle = s;
  closeTitleModal();
  save(); draw();
}

/* ---------- リセット ---------- */
function doReset() {
  const task = S.tasks.find(t => t.id === S.cur);
  if (!confirm(`「${task.icon} ${task.name}」をリセットします。よろしいですか？`)) return;
  const tid = S.cur;
  S.members.forEach(m => { m.done[tid] = 0; m.skip[tid] = 0; });
  S.history = S.history.filter(h => h.tid !== tid);
  S.idx[tid] = 0;
  S.undos = [];
  save(); draw();
}

/* ---------- 描画 ---------- */
function draw() {
  drawHeader();
  drawTabs();
  drawTaskEdit();
  drawDuty();
  drawMembers();
  drawStats();
  drawHistory();
}

function drawHeader() {
  document.title = S.title;
  document.getElementById('app-title').innerHTML =
    esc(S.title) + (S.subtitle ? ` <span>${esc(S.subtitle)}</span>` : '');
}

function drawTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  S.tasks.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab' + (t.id === S.cur ? ' on' : '');
    b.innerHTML = `<span class="tab-icon">${esc(t.icon)}</span>${esc(t.name)}`;
    b.onclick = () => selectTask(t.id);
    el.appendChild(b);
  });
  // モードボタン
  document.getElementById('m-order').className = 'mode-btn' + (S.mode === 'order' ? ' on' : '');
  document.getElementById('m-fair').className  = 'mode-btn' + (S.mode === 'fair'  ? ' on' : '');
}

function drawTaskEdit() {
  const grid = document.getElementById('task-edit-grid');
  grid.innerHTML = '';
  S.tasks.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'task-edit-item' + (t.id === S.cur ? ' active' : '');
    // 各inputを別々に生成（innerHTML でのinput生成を避ける）
    const iconIn = document.createElement('input');
    iconIn.className  = 'te-icon';
    iconIn.id         = 'te-icon-' + i;
    iconIn.value      = t.icon;
    iconIn.maxLength  = 2;
    iconIn.title      = '絵文字';

    const nameIn = document.createElement('input');
    nameIn.className  = 'te-name';
    nameIn.id         = 'te-name-' + i;
    nameIn.value      = t.name;
    nameIn.maxLength  = 10;
    nameIn.placeholder = 'タスク名';

    d.appendChild(iconIn);
    d.appendChild(nameIn);
    grid.appendChild(d);
  });
}

function drawDuty() {
  const task  = S.tasks.find(t => t.id === S.cur) || S.tasks[0];
  const nameEl = document.getElementById('current-name');
  const subEl  = document.getElementById('duty-sub');
  const badge  = document.getElementById('duty-badge');
  const done   = document.getElementById('btn-done');
  const skip   = document.getElementById('btn-skip');
  const undoB  = document.getElementById('btn-undo');

  badge.textContent = task.icon + ' ' + task.name;

  const c = curMember();
  if (!c) {
    nameEl.textContent = 'メンバーを追加してください';
    nameEl.className   = 'no-member';
    subEl.textContent  = '';
    done.disabled = skip.disabled = true;
  } else {
    nameEl.textContent = c.m.name;
    nameEl.className   = '';
    subEl.textContent  = S.mode === 'fair'
      ? '（完了回数: ' + (c.m.done[S.cur] || 0) + '回）' : '';
    done.disabled = skip.disabled = false;
  }
  undoB.disabled = S.undos.length === 0;
}

function drawMembers() {
  const ul = document.getElementById('member-list');
  ul.innerHTML = '';
  if (!S.members.length) {
    ul.innerHTML = '<li class="no-data">メンバーがいません</li>';
    return;
  }
  const tid = S.cur;
  const c   = curMember();
  S.members.forEach(m => {
    const isCur = c && m.id === c.m.id;
    const li    = document.createElement('li');
    li.className = 'member-item' + (isCur ? ' current' : '');

    const info = document.createElement('div');
    info.className = 'member-info';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'member-name';
    nameSpan.textContent = m.name;
    if (isCur) {
      const badge = document.createElement('span');
      badge.className   = 'member-now';
      badge.textContent = '今';
      nameSpan.appendChild(badge);
    }

    const statsSpan = document.createElement('span');
    statsSpan.className   = 'member-stats';
    statsSpan.textContent = `完了: ${m.done[tid]||0}回 / スキップ: ${m.skip[tid]||0}回`;

    info.appendChild(nameSpan);
    info.appendChild(statsSpan);

    const del = document.createElement('button');
    del.className   = 'del-btn';
    del.textContent = '削除';
    del.onclick     = () => delMember(m.id);

    li.appendChild(info);
    li.appendChild(del);
    ul.appendChild(li);
  });
}

function drawStats() {
  const ul  = document.getElementById('stats-list');
  ul.innerHTML = '';
  if (!S.members.length) {
    ul.innerHTML = '<li class="no-data">データなし</li>';
    return;
  }
  const tid = S.cur;
  const sorted = [...S.members].sort((a, b) => (b.done[tid]||0) - (a.done[tid]||0));
  sorted.forEach(m => {
    const li = document.createElement('li');
    li.className = 'stats-item';
    li.innerHTML =
      `<span style="font-weight:700">${esc(m.name)}</span>` +
      `<span>` +
        `<span class="badge badge-blue">✅ ${m.done[tid]||0}回</span>` +
        `<span class="badge badge-or">⏩ ${m.skip[tid]||0}回</span>` +
      `</span>`;
    ul.appendChild(li);
  });
}

function drawHistory() {
  const ul  = document.getElementById('hist-list');
  const msg = document.getElementById('no-hist');
  ul.innerHTML = '';
  if (!S.history.length) { msg.style.display = ''; return; }
  msg.style.display = 'none';
  S.history.forEach(h => {
    const task = S.tasks.find(t => t.id === h.tid);
    const li   = document.createElement('li');
    li.className = 'hist-item ' + h.type;
    const d = new Date(h.time);
    const pad = n => String(n).padStart(2,'0');
    const timeStr = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

    const top = document.createElement('div');
    top.className = 'hist-top';
    top.innerHTML =
      `<span><span class="hist-name">${esc(h.name)}</span>` +
      (task ? `<span class="hist-task"> — ${esc(task.icon+' '+task.name)}</span>` : '') +
      `</span>` +
      `<span class="h-tag ${h.type==='done'?'h-done':'h-skip'}">${h.type==='done'?'✅ 完了':'⏩ スキップ'}</span>`;

    const timeEl = document.createElement('span');
    timeEl.className   = 'hist-time';
    timeEl.textContent = timeStr;

    li.appendChild(top);
    li.appendChild(timeEl);
    if (h.reason) {
      const r = document.createElement('span');
      r.className   = 'hist-reason';
      r.textContent = '理由: ' + h.reason;
      li.appendChild(r);
    }
    ul.appendChild(li);
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 起動 ---------- */
load();
draw();
</script>
</body>
</html>
