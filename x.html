<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝕏 Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #000;
      --surface: #16181c;
      --border: #2f3336;
      --text: #e7e9ea;
      --muted: #71767b;
      --accent: #1d9bf0;
      --accent-h: #1a8cd8;
      --danger: #f4212e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Auth ── */
    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .auth-title { font-size: 28px; font-weight: 900; text-align: center; margin-bottom: 28px; }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .auth-tab {
      flex: 1; padding: 12px;
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 15px;
      border-bottom: 2px solid transparent;
      transition: color .2s;
    }
    .auth-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: bold; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 15px;
      outline: none; transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 12px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 9999px;
      font-size: 15px; font-weight: bold; cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: var(--accent-h); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }

    /* ── App ── */
    #app-screen {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-height: 100vh;
    }
    .app-header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-header h1 { font-size: 20px; font-weight: bold; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .uname { font-size: 14px; color: var(--muted); }
    .logout-btn {
      background: none; border: 1px solid var(--border);
      color: var(--text); padding: 6px 14px;
      border-radius: 9999px; font-size: 13px; cursor: pointer;
      transition: background .2s;
    }
    .logout-btn:hover { background: var(--surface); }

    /* ── Compose ── */
    .compose {
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }
    .compose-row { display: flex; gap: 12px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px; flex-shrink: 0;
      color: #fff;
    }
    .compose-inner { flex: 1; }
    textarea.compose-text {
      width: 100%; background: none; border: none;
      color: var(--text); font-size: 18px;
      resize: none; outline: none; min-height: 64px;
      font-family: inherit;
    }
    textarea.compose-text::placeholder { color: var(--muted); }
    .compose-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .char-count { font-size: 14px; color: var(--muted); }
    .char-count.warn { color: #ffd400; }
    .char-count.over { color: var(--danger); }
    .post-btn {
      padding: 8px 20px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 9999px;
      font-size: 15px; font-weight: bold; cursor: pointer;
      transition: background .2s;
    }
    .post-btn:hover { background: var(--accent-h); }
    .post-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Feed ── */
    .post-item {
      border-bottom: 1px solid var(--border);
      padding: 16px; display: flex; gap: 12px;
      transition: background .1s;
    }
    .post-item:hover { background: rgba(255,255,255,.03); }
    .post-body { flex: 1; min-width: 0; }
    .post-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .post-username { font-weight: bold; font-size: 15px; }
    .post-time { color: var(--muted); font-size: 14px; }
    .post-content { font-size: 15px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
    .del-btn {
      margin-left: auto;
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 13px; padding: 2px 8px;
      border-radius: 4px; opacity: 0; transition: opacity .2s, color .2s;
    }
    .post-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { color: var(--danger); }

    .state-msg {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 15px; line-height: 1.8;
    }
  </style>
</head>
<body>

<!-- ── Auth Screen ── -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">𝕏</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">ログイン</button>
      <button class="auth-tab" onclick="switchTab('register')">新規登録</button>
    </div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="l-email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="l-pass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="l-btn">ログイン</button>
      <div class="err" id="l-err"></div>
    </form>

    <form id="reg-form" onsubmit="doRegister(event)" style="display:none">
      <div class="form-group">
        <label>ユーザー名（英数字・_）</label>
        <input type="text" id="r-name" placeholder="username" required
               pattern="[a-zA-Z0-9_]+" minlength="3" maxlength="20" autocomplete="username">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="r-email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード（6文字以上）</label>
        <input type="password" id="r-pass" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="r-btn">アカウント作成</button>
      <div class="err" id="r-err"></div>
    </form>
  </div>
</div>

<!-- ── App Screen ── -->
<div id="app-screen">
  <div class="app-header">
    <h1>ホーム</h1>
    <div class="header-right">
      <span class="uname" id="hdr-uname"></span>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="compose">
    <div class="compose-row">
      <div class="avatar" id="compose-avatar"></div>
      <div class="compose-inner">
        <textarea class="compose-text" id="compose-text"
          placeholder="いまどうしてる？" maxlength="280"
          oninput="onTextInput()"></textarea>
        <div class="compose-footer">
          <span class="char-count" id="char-count">280</span>
          <button class="post-btn" id="post-btn" onclick="doPost()" disabled>ポスト</button>
        </div>
      </div>
    </div>
  </div>

  <div id="feed">
    <div class="state-msg">読み込み中…</div>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let me = null;
  let myProfile = null;
  let realtimeCh = null;

  // ── Tab ──
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((el, i) => {
      el.classList.toggle('active', (tab === 'login') === (i === 0));
    });
    document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('reg-form').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('l-err').textContent = '';
    document.getElementById('r-err').textContent = '';
  }

  // ── Auth ──
  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('l-btn');
    const err = document.getElementById('l-err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'ログイン中…';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('l-email').value,
      password: document.getElementById('l-pass').value,
    });
    btn.disabled = false;
    btn.textContent = 'ログイン';
    if (error) err.textContent = error.message;
  }

  async function doRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('r-btn');
    const err = document.getElementById('r-err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '作成中…';

    const username = document.getElementById('r-name').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const password = document.getElementById('r-pass').value;

    // ユーザー名重複チェック
    const { data: existing } = await sb
      .from('profiles').select('id').eq('username', username).maybeSingle();
    if (existing) {
      err.textContent = 'このユーザー名はすでに使われています';
      btn.disabled = false;
      btn.textContent = 'アカウント作成';
      return;
    }

    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) {
      err.textContent = error.message;
      btn.disabled = false;
      btn.textContent = 'アカウント作成';
      return;
    }

    if (data.user) {
      const { error: pe } = await sb.from('profiles').insert({ id: data.user.id, username });
      if (pe) {
        err.textContent = 'プロフィール作成失敗: ' + pe.message;
        await sb.auth.signOut();
        btn.disabled = false;
        btn.textContent = 'アカウント作成';
        return;
      }
    }

    btn.disabled = false;
    btn.textContent = 'アカウント作成';
  }

  async function doLogout() {
    await sb.auth.signOut();
  }

  // ── Screens ──
  function showAuth() {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
    if (realtimeCh) { sb.removeChannel(realtimeCh); realtimeCh = null; }
  }

  async function showApp(user) {
    me = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';

    // プロフィール取得（登録直後の競合を考慮してリトライ）
    for (let i = 0; i < 5; i++) {
      const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (data) { myProfile = data; break; }
      await new Promise(r => setTimeout(r, 400));
    }

    const label = myProfile ? '@' + myProfile.username : user.email;
    const initial = myProfile ? myProfile.username[0].toUpperCase() : '?';
    document.getElementById('hdr-uname').textContent = label;
    document.getElementById('compose-avatar').textContent = initial;

    loadFeed();
    subscribeRealtime();
  }

  // ── Compose ──
  function onTextInput() {
    const len = document.getElementById('compose-text').value.length;
    const rem = 280 - len;
    const el = document.getElementById('char-count');
    el.textContent = rem;
    el.className = 'char-count' + (rem < 20 ? ' over' : rem < 50 ? ' warn' : '');
    document.getElementById('post-btn').disabled = len === 0;
  }

  async function doPost() {
    const text = document.getElementById('compose-text').value.trim();
    if (!text || !me) return;
    const btn = document.getElementById('post-btn');
    btn.disabled = true;
    btn.textContent = '送信中…';
    const { error } = await sb.from('posts').insert({ user_id: me.id, content: text });
    if (!error) {
      document.getElementById('compose-text').value = '';
      onTextInput();
    }
    btn.textContent = 'ポスト';
  }

  // ── Feed ──
  async function loadFeed() {
    document.getElementById('feed').innerHTML = '<div class="state-msg">読み込み中…</div>';
    const { data: posts, error } = await sb
      .from('posts')
      .select('*, profiles(username)')
      .order('created_at', { ascending: false })
      .limit(100);
    if (error) {
      document.getElementById('feed').innerHTML = '<div class="state-msg">読み込みに失敗しました</div>';
      return;
    }
    renderFeed(posts);
  }

  function renderFeed(posts) {
    if (!posts.length) {
      document.getElementById('feed').innerHTML =
        '<div class="state-msg">まだポストがありません<br>最初のポストをどうぞ！</div>';
      return;
    }
    document.getElementById('feed').innerHTML = posts.map(postHTML).join('');
  }

  function postHTML(p) {
    const uname = p.profiles?.username ?? '不明';
    const initial = uname[0].toUpperCase();
    const isOwn = me && p.user_id === me.id;
    return `
      <div class="post-item" data-id="${p.id}">
        <div class="avatar">${initial}</div>
        <div class="post-body">
          <div class="post-meta">
            <span class="post-username">@${esc(uname)}</span>
            <span class="post-time">${relTime(p.created_at)}</span>
            ${isOwn ? `<button class="del-btn" onclick="doDelete('${p.id}')">削除</button>` : ''}
          </div>
          <div class="post-content">${esc(p.content)}</div>
        </div>
      </div>`;
  }

  async function doDelete(id) {
    await sb.from('posts').delete().eq('id', id);
    document.querySelector(`[data-id="${id}"]`)?.remove();
    if (!document.querySelector('.post-item')) {
      document.getElementById('feed').innerHTML =
        '<div class="state-msg">まだポストがありません</div>';
    }
  }

  // ── Realtime ──
  function subscribeRealtime() {
    realtimeCh = sb.channel('posts-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, async payload => {
        const { data: p } = await sb
          .from('posts').select('*, profiles(username)').eq('id', payload.new.id).single();
        if (!p) return;
        const feed = document.getElementById('feed');
        const empty = feed.querySelector('.state-msg');
        if (empty) empty.remove();
        feed.insertAdjacentHTML('afterbegin', postHTML(p));
      })
      .subscribe();
  }

  // ── Utils ──
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function relTime(iso) {
    const d = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (d < 60) return 'たった今';
    if (d < 3600) return Math.floor(d / 60) + '分前';
    if (d < 86400) return Math.floor(d / 3600) + '時間前';
    return new Date(iso).toLocaleDateString('ja-JP');
  }

  // ── Auth listener ──
  sb.auth.onAuthStateChange((_event, session) => {
    if (session?.user) showApp(session.user);
    else showAuth();
  });
</script>
</body>
</html>
