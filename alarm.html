<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --accent: #ff6b35;
      --accent-dim: #cc4a1a;
      --text: #f0f0f0;
      --text-dim: #888;
      --success: #4caf50;
      --danger: #e53935;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
    }

    /* Current time display */
    #clock {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
      margin-bottom: 40px;
      text-align: center;
    }

    /* Add alarm form */
    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    input[type="time"] {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1.6rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 150px;
    }

    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
      cursor: pointer;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add:hover { background: var(--accent-dim); }

    /* Alarm list */
    #alarm-list {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alarm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .alarm-item.active {
      border-color: var(--accent);
    }

    .alarm-item.off {
      opacity: 0.4;
    }

    .alarm-time {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .alarm-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--accent);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.2s;
    }

    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(20px);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    .btn-delete:hover { color: var(--danger); }

    .empty-msg {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
      padding: 24px 0;
      letter-spacing: 0.08em;
    }

    /* Ringing overlay */
    #ring-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #ring-overlay.show { display: flex; }

    #ring-time {
      font-size: 5rem;
      font-weight: 700;
      color: var(--accent);
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    #ring-label {
      font-size: 1rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .btn-stop {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s;
    }

    .btn-stop:hover { background: var(--accent-dim); }

    @keyframes pulse {
      from { opacity: 0.7; transform: scale(0.97); }
      to   { opacity: 1;   transform: scale(1.03); }
    }
  </style>
</head>
<body>

  <h1>⏰ Alarm</h1>
  <div id="clock">00:00:00</div>

  <div class="add-form">
    <input type="time" id="time-input" value="07:00">
    <button class="btn-add" onclick="addAlarm()">SET</button>
  </div>

  <div id="alarm-list"></div>

  <!-- Ringing overlay -->
  <div id="ring-overlay">
    <div id="ring-time"></div>
    <div id="ring-label">アラーム</div>
    <button class="btn-stop" onclick="stopAlarm()">STOP</button>
  </div>

  <audio id="beep" preload="auto"></audio>

  <script>
    // ── State ──────────────────────────────────────────────
    let alarms = JSON.parse(localStorage.getItem('alarms') || '[]');
    let ringingId = null;
    let audioCtx = null;
    let beepInterval = null;

    // ── Clock ──────────────────────────────────────────────
    function tickClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }

    // ── Alarm check ────────────────────────────────────────
    function checkAlarms() {
      if (ringingId !== null) return;
      const now = new Date();
      const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      if (now.getSeconds() !== 0) return;

      for (const a of alarms) {
        if (a.enabled && a.time === hhmm) {
          ring(a);
          break;
        }
      }
    }

    // ── Sound (Web Audio API) ──────────────────────────────
    function playBeep() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function beep() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
      beep();
      beepInterval = setInterval(beep, 900);
    }

    function stopBeep() {
      if (beepInterval) { clearInterval(beepInterval); beepInterval = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
    }

    // ── Ring / Stop ────────────────────────────────────────
    function ring(alarm) {
      ringingId = alarm.id;
      document.getElementById('ring-time').textContent = alarm.time;
      document.getElementById('ring-overlay').classList.add('show');
      playBeep();
    }

    function stopAlarm() {
      stopBeep();
      document.getElementById('ring-overlay').classList.remove('show');
      ringingId = null;
    }

    // ── Add / Delete / Toggle ──────────────────────────────
    function addAlarm() {
      const val = document.getElementById('time-input').value;
      if (!val) return;
      alarms.push({ id: Date.now().toString(), time: val, enabled: true });
      alarms.sort((a,b) => a.time.localeCompare(b.time));
      save();
      render();
    }

    function deleteAlarm(id) {
      alarms = alarms.filter(a => a.id !== id);
      save();
      render();
    }

    function toggleAlarm(id) {
      const a = alarms.find(a => a.id === id);
      if (a) a.enabled = !a.enabled;
      save();
      render();
    }

    // ── Persist ────────────────────────────────────────────
    function save() {
      localStorage.setItem('alarms', JSON.stringify(alarms));
    }

    // ── Render ─────────────────────────────────────────────
    function render() {
      const list = document.getElementById('alarm-list');
      if (alarms.length === 0) {
        list.innerHTML = '<p class="empty-msg">アラームなし</p>';
        return;
      }
      list.innerHTML = alarms.map(a => `
        <div class="alarm-item ${a.enabled ? 'active' : 'off'}">
          <span class="alarm-time">${a.time}</span>
          <div class="alarm-controls">
            <label class="toggle">
              <input type="checkbox" ${a.enabled ? 'checked' : ''}
                onchange="toggleAlarm('${a.id}')">
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
            <button class="btn-delete" onclick="deleteAlarm('${a.id}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    // ── Init ───────────────────────────────────────────────
    render();
    tickClock();
    setInterval(() => { tickClock(); checkAlarms(); }, 1000);
  </script>
</body>
</html>
